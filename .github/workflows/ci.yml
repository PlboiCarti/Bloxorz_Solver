name: CI

on:
  push:
    branches:
      - gui_v2
  pull_request:
    branches:
      - gui_v2

permissions:
  contents: read

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q game solvers server.py

      - name: Check core imports
        run: python -c "import game, solvers, server; print('Core imports OK')"
