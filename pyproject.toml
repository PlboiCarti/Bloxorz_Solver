[project]
name = "bloxorz-solver"
version = "0.1.0"
description = "Bloxorz AI solver"
readme = "README.md"
authors = [
    { name = "cheemsHCMUS", email = "24120306@student.hcmus.edu.vn" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.146.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["game", "tests"]
